name: EDIN Site Studio MVP2 QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-studio-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static syntax checks
        run: |
          node --check worker.js
          node --check public/administrar/admin.js
          node --check public/editorial-client.js
          node --check public/testimonials.js

      - name: Start Worker locally
        run: |
          npx wrangler@4 dev --local --port 8787 --var ADMIN_PASSWORD:testpass > /tmp/wrangler.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then
              echo "WORKER_READY=YES"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1

      - name: Validate Site Studio lifecycle
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:8787
          assert_file_contains(){ grep -q -- "$2" "$1" || { echo "ASSERT_FAIL file=$1 expected=$2"; cat "$1"; exit 1; }; }

          echo "QA_STEP=public-routes"
          test "$(curl -s -o /dev/null -w '%{http_code}' $BASE/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' $BASE/administrar/)" = "200"
          curl -fsS $BASE/api/content > /tmp/public0.json
          assert_file_contains /tmp/public0.json '"version":2'
          assert_file_contains /tmp/public0.json '"testimonials"'
          assert_file_contains /tmp/public0.json '"customPages"'

          echo "QA_STEP=admin-ui-mvp2"
          grep -q 'EDIN Site Studio · MVP 2' public/administrar/index.html
          grep -q 'data-media' public/administrar/index.html
          grep -q 'data-add-testimonial' public/administrar/index.html
          grep -q 'data-add-page' public/administrar/index.html
          grep -q 'data-add-block' public/administrar/index.html

          echo "QA_STEP=auth"
          BAD=$(curl -s -o /tmp/bad.json -w '%{http_code}' -H 'content-type: application/json' -d '{"password":"wrong"}' $BASE/api/admin/login)
          test "$BAD" = "401"
          curl -fsS -c /tmp/cookies -H 'content-type: application/json' -d '{"password":"testpass"}' $BASE/api/admin/login > /tmp/login.json
          assert_file_contains /tmp/login.json '"ok":true'
          curl -fsS -b /tmp/cookies $BASE/api/admin/state > /tmp/state.json

          echo "QA_STEP=mvp2-draft"
          node <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/state.json','utf8'));
          const d=s.draft;
          d.theme='salvia';
          d.pages.home.texts.heroLead='Soy Verónica Valencia Yáñez, Matrona. Texto editorial MVP2.';
          d.pages.home.media.hero={url:'https://example.com/veronica-mvp2.jpg',alt:'Verónica en prueba MVP2',visible:true};
          d.testimonials.push({id:'TEST-QA',quote:'Testimonio autorizado de prueba para Site Studio.',publicationName:'Participante QA',serviceContext:'Taller de prueba',authorizationConfirmed:true,publicationReady:true,showHome:true,showDay:false});
          d.customPages.push({id:'page-qa',title:'Página piloto EDIN',slug:'pagina-piloto-edin',description:'Página creada desde Site Studio.',status:'published',blocks:[{id:'b1',type:'text',title:'Bloque de texto',body:'Contenido editable por bloques.',visible:true},{id:'b2',type:'cta',title:'Siguiente paso',body:'CTA protegido.',buttonLabel:'Volver al inicio',buttonUrl:'https://mujerymaternidad.cl/',visible:true},{id:'b3',type:'testimonials',title:'Experiencias',visible:true}]});
          fs.writeFileSync('/tmp/draft.json',JSON.stringify(d));
          NODE
          curl -fsS -b /tmp/cookies -X PUT -H 'content-type: application/json' --data-binary @/tmp/draft.json $BASE/api/admin/draft > /tmp/save.json
          assert_file_contains /tmp/save.json '"ok":true'
          curl -fsS -b /tmp/cookies "$BASE/api/content?preview=1" > /tmp/preview.json
          assert_file_contains /tmp/preview.json 'example.com/veronica-mvp2.jpg'
          assert_file_contains /tmp/preview.json 'Testimonio autorizado de prueba para Site Studio.'
          assert_file_contains /tmp/preview.json 'pagina-piloto-edin'

          echo "QA_STEP=authenticated-preview"
          UNAUTH=$(curl -s -o /tmp/unauth.txt -w '%{http_code}' "$BASE/?editorial_preview=1")
          test "$UNAUTH" = "401"
          curl -fsS -b /tmp/cookies "$BASE/?editorial_preview=1" > /tmp/home-preview.html
          assert_file_contains /tmp/home-preview.html 'window.__MYM_EDITORIAL_PREVIEW_CONFIG='
          assert_file_contains /tmp/home-preview.html 'example.com/veronica-mvp2.jpg'
          curl -fsS -b /tmp/cookies "$BASE/paginas/pagina-piloto-edin/?editorial_preview=1" > /tmp/custom-preview.html
          assert_file_contains /tmp/custom-preview.html 'Página piloto EDIN'
          assert_file_contains /tmp/custom-preview.html 'Contenido editable por bloques.'
          assert_file_contains /tmp/custom-preview.html 'Testimonio autorizado de prueba para Site Studio.'

          echo "QA_STEP=publish"
          curl -fsS -b /tmp/cookies -X POST $BASE/api/admin/publish > /tmp/publish.json
          assert_file_contains /tmp/publish.json '"ok":true'
          curl -fsS $BASE/api/content > /tmp/public1.json
          assert_file_contains /tmp/public1.json 'example.com/veronica-mvp2.jpg'
          assert_file_contains /tmp/public1.json 'Testimonio autorizado de prueba para Site Studio.'
          curl -fsS "$BASE/paginas/pagina-piloto-edin/" > /tmp/custom-public.html
          assert_file_contains /tmp/custom-public.html 'Página piloto EDIN'
          assert_file_contains /tmp/custom-public.html 'Sitio web creado por Servicio de Gestión EDIN'

          echo "QA_STEP=draft-page-not-public"
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/draft.json','utf8'));
          d.customPages.push({id:'page-private',title:'Solo borrador',slug:'solo-borrador',description:'No pública',status:'draft',blocks:[]});
          fs.writeFileSync('/tmp/draft2.json',JSON.stringify(d));
          NODE
          curl -fsS -b /tmp/cookies -X PUT -H 'content-type: application/json' --data-binary @/tmp/draft2.json $BASE/api/admin/draft >/tmp/save2.json
          test "$(curl -s -o /dev/null -w '%{http_code}' $BASE/paginas/solo-borrador/)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/cookies "$BASE/paginas/solo-borrador/?editorial_preview=1")" = "200"

          echo "QA_STEP=logout"
          curl -fsS -b /tmp/cookies -c /tmp/cookies -X POST $BASE/api/admin/logout >/tmp/logout.json
          assert_file_contains /tmp/logout.json '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/cookies $BASE/api/admin/state)" = "401"
          echo "EDIN_SITE_STUDIO_MVP2_QA=PASS"

      - name: Show Worker log
        if: always()
        run: cat /tmp/wrangler.log || true
