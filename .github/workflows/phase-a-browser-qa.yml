name: Phase A Browser QA

on:
  push:
    branches:
      - feat/global-web-v1-phase-a-20260816
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Start local preview
        run: |
          python -m http.server 4173 --directory public > /tmp/mym-preview.log 2>&1 &
          echo $! > /tmp/mym-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "PREVIEW_READY=YES"
              exit 0
            fi
            sleep 1
          done
          echo "PREVIEW_READY=NO"
          cat /tmp/mym-preview.log
          exit 1

      - name: Run real-browser QA
        run: |
          cat > /tmp/phase_a_qa.py <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse, parse_qs
          from playwright.sync_api import sync_playwright

          BASE = "http://127.0.0.1:4173"
          OUT = Path("qa-artifacts")
          OUT.mkdir(exist_ok=True)
          checks = []
          failures = []

          def check(name, condition, detail=""):
              ok = bool(condition)
              checks.append({"name": name, "pass": ok, "detail": detail})
              print(f"{'PASS' if ok else 'FAIL'} | {name} | {detail}")
              if not ok:
                  failures.append(name)

          routes = [
              ("home", "/"),
              ("servicios", "/servicios/"),
              ("talleres", "/talleres/"),
              ("recursos", "/recursos/"),
              ("sobre-mi", "/sobre-mi/"),
              ("contacto", "/contacto/"),
              ("dia-de-lactancia", "/dia-de-lactancia/"),
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              # Desktop routing and JS smoke test
              context = browser.new_context(viewport={"width": 1440, "height": 1000})
              page = context.new_page()
              js_errors = []
              local_failed_requests = []
              page.on("pageerror", lambda exc: js_errors.append(str(exc)))
              page.on("requestfailed", lambda req: local_failed_requests.append(f"{req.method} {req.url} :: {req.failure}") if req.url.startswith(BASE) else None)

              for name, route in routes:
                  response = page.goto(BASE + route, wait_until="domcontentloaded")
                  page.wait_for_timeout(500)
                  check(f"route:{name}:200", response is not None and response.status == 200, f"status={response.status if response else 'NONE'}")
                  overflow = page.evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth + 2")
                  check(f"route:{name}:no-horizontal-overflow-desktop", not overflow, f"scroll={page.evaluate('document.documentElement.scrollWidth')} client={page.evaluate('document.documentElement.clientWidth')}")

              # Home desktop
              page.goto(BASE + "/", wait_until="domcontentloaded")
              page.wait_for_timeout(900)
              check("home:h1", "Acompañamiento e información" in page.locator("h1").inner_text(), page.locator("h1").inner_text())
              check("home:journey-cards", page.locator("[data-journey-id]").count() >= 6, f"count={page.locator('[data-journey-id]').count()}")
              check("home:trust-signals", page.locator(".trust-signal").count() == 4, f"count={page.locator('.trust-signal').count()}")
              check("home:testimonials-hidden-without-data", page.locator("[data-testimonials-section]").evaluate("el => el.hidden === true"), "hidden expected")
              logo_src = page.locator(".site-header .brand img").get_attribute("src") or ""
              check("home:svg-logo", logo_src.endswith("/assets/brand-logo.svg"), logo_src)
              favicon = page.locator('link[rel="icon"]').get_attribute("href") or ""
              check("home:svg-favicon", favicon.endswith("/assets/brand-mark.svg"), favicon)
              check("home:canonical", page.locator('link[rel="canonical"]').get_attribute("href") == "https://mujerymaternidad.cl/", page.locator('link[rel="canonical"]').get_attribute("href") or "")
              page.screenshot(path=str(OUT / "home-desktop.png"), full_page=True)

              # Día de Lactancia desktop with tracking query propagation
              landing_url = BASE + "/dia-de-lactancia/?utm_source=qa&utm_medium=preview&utm_campaign=phase_a&utm_content=browser&fbclid=QA123"
              page.goto(landing_url, wait_until="domcontentloaded")
              page.wait_for_timeout(900)
              check("landing:section-fit", page.get_by_text("Este Día de Lactancia puede ayudarte si…", exact=False).count() == 1, "section present")
              check("landing:section-how-to-book", page.get_by_text("Así reservas tu lugar", exact=False).count() == 1, "section present")
              check("landing:next-step", page.get_by_text("Mujer y Maternidad continúa después del taller", exact=False).count() == 1, "section present")
              check("landing:testimonials-placeholder-hidden", page.locator("#testimonios").evaluate("el => el.hidden === true"), "hidden expected")
              check("landing:canonical", page.locator('link[rel="canonical"]').get_attribute("href") == "https://mujerymaternidad.cl/dia-de-lactancia/", page.locator('link[rel="canonical"]').get_attribute("href") or "")
              landing_logo = page.locator(".site-header .brand img").get_attribute("src") or ""
              check("landing:svg-logo", landing_logo.endswith("/assets/brand-logo.svg"), landing_logo)

              expected_products = {
                  "introduction": "P107107126L",
                  "milkBank": "R107107268P",
                  "combo": "S107178973Y",
              }
              for key, product_id in expected_products.items():
                  locator = page.locator(f'[data-product="{key}"]').first
                  href = locator.get_attribute("href") or ""
                  parsed = urlparse(href)
                  qs = parse_qs(parsed.query)
                  check(f"landing:{key}:hotmart-product", product_id in parsed.path, href)
                  check(f"landing:{key}:utm-source", qs.get("utm_source") == ["qa"], href)
                  check(f"landing:{key}:utm-medium", qs.get("utm_medium") == ["preview"], href)
                  check(f"landing:{key}:utm-campaign", qs.get("utm_campaign") == ["phase_a"], href)
                  check(f"landing:{key}:fbclid", qs.get("fbclid") == ["QA123"], href)
              page.screenshot(path=str(OUT / "dia-lactancia-desktop.png"), full_page=True)

              # Mobile real-browser QA
              mctx = browser.new_context(viewport={"width": 390, "height": 844}, device_scale_factor=1)
              mpage = mctx.new_page()
              m_js_errors = []
              m_local_failed = []
              mpage.on("pageerror", lambda exc: m_js_errors.append(str(exc)))
              mpage.on("requestfailed", lambda req: m_local_failed.append(f"{req.method} {req.url} :: {req.failure}") if req.url.startswith(BASE) else None)

              mpage.goto(BASE + "/", wait_until="domcontentloaded")
              mpage.wait_for_timeout(900)
              overflow = mpage.evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth + 2")
              check("home:no-horizontal-overflow-mobile", not overflow, f"scroll={mpage.evaluate('document.documentElement.scrollWidth')} client={mpage.evaluate('document.documentElement.clientWidth')}")
              check("home:mobile-menu-visible", mpage.locator("[data-menu-toggle]").is_visible(), "390px viewport")
              mpage.screenshot(path=str(OUT / "home-mobile.png"), full_page=True)

              mpage.goto(BASE + "/dia-de-lactancia/", wait_until="domcontentloaded")
              mpage.wait_for_timeout(900)
              overflow = mpage.evaluate("document.documentElement.scrollWidth > document.documentElement.clientWidth + 2")
              check("landing:no-horizontal-overflow-mobile", not overflow, f"scroll={mpage.evaluate('document.documentElement.scrollWidth')} client={mpage.evaluate('document.documentElement.clientWidth')}")
              check("landing:primary-combo-visible-mobile", mpage.locator(".hero .combo-link").is_visible(), "390px viewport")
              mpage.screenshot(path=str(OUT / "dia-lactancia-mobile.png"), full_page=True)

              # Source-level privacy/tracking guards
              site_js = Path("public/site.js").read_text(encoding="utf-8")
              landing_js = Path("public/dia-de-lactancia/main.js").read_text(encoding="utf-8")
              check("privacy:no-JourneySelection", "JourneySelection" not in site_js, "health-stage selection must not be sent to Meta")
              check("tracking:no-duplicate-InitiateCheckout-in-landing", "InitiateCheckout" not in landing_js, "Hotmart remains checkout event source")
              check("tracking:landing-page-type-workshop", "page_type:'WORKSHOP'" in landing_js, "normalized taxonomy")
              check("assets:brand-logo-exists", Path("public/assets/brand-logo.svg").exists(), "")
              check("assets:brand-mark-exists", Path("public/assets/brand-mark.svg").exists(), "")

              check("browser:no-desktop-js-errors", not js_errors, json.dumps(js_errors, ensure_ascii=False))
              check("browser:no-mobile-js-errors", not m_js_errors, json.dumps(m_js_errors, ensure_ascii=False))
              check("browser:no-local-failed-requests-desktop", not local_failed_requests, json.dumps(local_failed_requests, ensure_ascii=False))
              check("browser:no-local-failed-requests-mobile", not m_local_failed, json.dumps(m_local_failed, ensure_ascii=False))

              browser.close()

          summary = {
              "status": "PASS" if not failures else "FAIL",
              "checks": checks,
              "failures": failures,
              "passed": sum(1 for c in checks if c["pass"]),
              "total": len(checks),
          }
          (OUT / "qa-results.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          md = [
              "# Mujer y Maternidad — Phase A Browser QA",
              "",
              f"**Status:** `{summary['status']}`",
              f"**Checks:** `{summary['passed']}/{summary['total']}`",
              "",
          ]
          for item in checks:
              md.append(f"- {'PASS' if item['pass'] else 'FAIL'} — `{item['name']}` — {item['detail']}")
          (OUT / "qa-summary.md").write_text("\n".join(md) + "\n", encoding="utf-8")
          print(f"BROWSER_QA_STATUS={summary['status']}")
          print(f"BROWSER_QA_CHECKS={summary['passed']}/{summary['total']}")
          if failures:
              print("BROWSER_QA_FAILURES=" + ",".join(failures))
              raise SystemExit(1)
          PY
          python /tmp/phase_a_qa.py

      - name: Show QA summary
        if: always()
        run: |
          if [ -f qa-artifacts/qa-summary.md ]; then cat qa-artifacts/qa-summary.md; fi
          if [ -f /tmp/mym-preview.log ]; then echo '--- preview log ---'; cat /tmp/mym-preview.log; fi

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mujer-maternidad-phase-a-browser-qa
          path: qa-artifacts/
          if-no-files-found: error
